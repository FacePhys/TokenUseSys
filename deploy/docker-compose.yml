# 部署见开发文档 §12.3、§12.5。命令都在仓库根目录执行：docker compose -f deploy/docker-compose.yml ...
name: relayusage

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: relayusage:local
    volumes:
      # 正式部署在 deploy/.env 里用 RELAYUSAGE_CONFIG 指向服务器上的配置（参考 deploy/.env.example）
      - ${RELAYUSAGE_CONFIG:-../config.yaml}:/etc/relayusage/config.yaml:ro
      - data:/var/lib/relayusage
      - logs:/var/log/relayusage
    environment:
      TZ: Asia/Shanghai
    ports:
      # 只绑本机，外部只能经过 Nginx 访问；容器里的 server.listen 写 0.0.0.0:8200
      - "127.0.0.1:8200:8200"
    mem_limit: 256m
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  data:
  logs:
