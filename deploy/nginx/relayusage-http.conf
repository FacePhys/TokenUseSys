# RelayUsage 的 Nginx 配置（一）：80 端口只做跳转和证书签发（开发文档 §12.4）。
# 复制为 /etc/nginx/sites-available/relayusage-http.conf，在 sites-enabled 建软链；把 usage.example.com 换成自己的域名。
# 先上这个文件签证书，再上 relayusage-https.conf。
server {
    listen 80;
    listen [::]:80;
    server_name usage.example.com;

    # 证书用 webroot 方式签发 / 续期：certbot 把验证文件写到 /var/www/letsencrypt（§12.5 第 5 步）。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    # 跳转要写在 location 里：写在 server 级会连上面的验证请求一起跳走。
    location / {
        return 301 https://$host$request_uri;
    }
}
