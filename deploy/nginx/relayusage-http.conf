# RelayUsage 的 Nginx 配置（一）：80 端口只做跳转和证书签发（开发文档 §12.4）。
# 复制到 /etc/nginx/conf.d/，把 usage.example.com 换成自己的域名。先上这个文件签证书，再上 relayusage-https.conf。
server {
    listen 80;
    listen [::]:80;
    server_name usage.example.com;

    # 跳转要写在 location 里：写在 server 级会拦掉 certbot 签发 / 续期时插入的 acme-challenge location。
    location / {
        return 301 https://$host$request_uri;
    }
}
