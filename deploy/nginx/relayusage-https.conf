# RelayUsage 的 Nginx 配置（二）：443 端口反向代理到本机 8200（开发文档 §12.4）。
# 复制为 /etc/nginx/sites-available/relayusage-https.conf，在 sites-enabled 建软链；把 usage.example.com 换成自己的域名。
# 证书签好之后再启用这个文件，否则 nginx -t 会失败。不要放 conf.d：它比 sites-enabled 先加载，
# 这个 server 会变成 443 的默认站点，不带 SNI 或域名对不上的 HTTPS 请求都会落到看板上。
server {
    # 部署机是 nginx 1.18，不认单独一行的 http2 on;（1.25.1 起才有）。1.25.1 及以上版本这样写会提示 deprecated，照样能用。
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name usage.example.com;

    ssl_certificate     /etc/letsencrypt/live/usage.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/usage.example.com/privkey.pem;

    # 域名走 Cloudflare 时取消注释（文件复制到 /etc/nginx/snippets/），按 CF-Connecting-IP 还原用户的真实 IP。
    # include /etc/nginx/snippets/relayusage-realip.conf;

    # 可选：只放行公司出口 IP
    # allow 1.2.3.4;
    # deny all;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" always;

    # 证书续期的验证请求一般在 80 端口就答了；走 Cloudflare 且开了 Always Use HTTPS 时会被跳到这里。
    # allow all：上面开了 IP 白名单也不能挡住它，否则续期会失败。
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    # 健康检查返回同步错误原文，不对外暴露；本机用 curl 127.0.0.1:8200/healthz
    location = /healthz {
        deny all;
    }

    location / {
        proxy_pass http://127.0.0.1:8200;
        proxy_set_header Host $host;
        # 用 $remote_addr 覆盖，不追加客户端自带的 X-Forwarded-For（服务只采信本机和内网代理转发的地址，§8）
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
