# RelayUsage 的 Nginx 配置（二）：443 端口反向代理到本机 8200（开发文档 §12.4）。
# 复制到 /etc/nginx/conf.d/，把 usage.example.com 换成自己的域名；证书签好之后再启用这个文件，否则 nginx -t 会失败。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;    # nginx < 1.25.1 不支持：删掉这行，上面两行改成 listen 443 ssl http2;
    server_name usage.example.com;

    ssl_certificate     /etc/letsencrypt/live/usage.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/usage.example.com/privkey.pem;

    # 域名走 Cloudflare 时取消注释（文件复制到 /etc/nginx/snippets/），按 CF-Connecting-IP 还原用户的真实 IP。
    # include /etc/nginx/snippets/relayusage-realip.conf;

    # 可选：只放行公司出口 IP
    # allow 1.2.3.4;
    # deny all;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" always;

    # 健康检查返回同步错误原文，不对外暴露；本机用 curl 127.0.0.1:8200/healthz
    location = /healthz {
        deny all;
    }

    location / {
        proxy_pass http://127.0.0.1:8200;
        proxy_set_header Host $host;
        # 用 $remote_addr 覆盖，不追加客户端自带的 X-Forwarded-For（服务只采信本机和内网代理转发的地址，§8）
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
